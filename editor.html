<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>쓰기 쉬운 GIF 편집기</title>
  <link rel="stylesheet" href="mode-nav.css">
  <link rel="stylesheet" href="editor.css">
  <script defer src="vendor/omggif.js"></script>
  <script defer src="gif-resize.js"></script>
  <script defer src="editor.js"></script>
</head>
<body>
  <header><a href="https://kmou.ac.kr" target="_blank" rel="noopener noreferrer"><img src="kmou.png" alt="국립한국해양대학교"></a><strong>스마트 GIF 편집기</strong></header>
  <nav class="mode-nav" aria-label="GIF 작업 선택"><a href="index.html">생성기</a><a href="editor.html" aria-current="page">편집기</a></nav>
  <main>
    <h1>쓰기 쉬운 GIF 편집기</h1>
    <p class="subtitle">GIF 파일을 간편히 편집하기</p>
    <div id="warning" role="alert" hidden></div>
    <section id="upload" class="card">
      <div id="drop">
        <span class="file-icon" aria-hidden="true">GIF</span>
        <h2>GIF 파일을 여기에 놓으세요</h2>
        <p>한 번에 파일 1개를 편집할 수 있습니다.</p>
        <button id="choose" class="primary">파일 선택</button>
        <input id="file" type="file" accept="image/gif,.gif" hidden>
      </div>
    </section>
    <div id="workspace" hidden>
      <div class="previews">
        <details id="original" class="card" open><summary>Original GIF</summary>
          <img id="originalImage" class="preview" alt="원본 GIF 미리보기">
          <p id="originalName" class="name"></p><p id="originalInfo"></p>
        </details>
        <section id="result" class="card" hidden><h2>Resized GIF</h2>
          <img id="resultImage" class="preview" alt="크기를 조절한 GIF 미리보기">
          <p id="resultName" class="name"></p><p id="resultInfo"></p>
          <a id="download" class="primary">다운로드</a>
        </section>
      </div>
      <section class="card tools"><h2 id="toolTitle" tabindex="-1">편집 도구</h2>
        <div id="tools"></div>
        <div id="settings" hidden>
          <div id="resizeControls">
            <label for="x">가로 (X) <output id="xValue" for="x"></output></label>
            <input id="x" type="range" min="5" max="300" value="100">
            <button id="lock" aria-pressed="true"></button>
            <label for="y">세로 (Y) <output id="yValue" for="y"></output></label>
            <input id="y" type="range" min="5" max="300" value="100">
          </div>
          <p id="pending" hidden>이 도구는 준비 중입니다.</p>
          <div class="actions"><button id="back">Back</button><button id="go" class="primary">Go!</button></div>
        </div>
      </section>
      <button id="reset">다른 GIF 선택</button>
    </div>
    <p id="status" role="status"></p>
  </main>
</body>
</html>
